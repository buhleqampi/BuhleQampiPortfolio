<h1 class="d-flex justify-content-center mt-2 text-white">Projects</h1>
<div class="container-fluid">
  <div class="row gap-5 mx-1 d-sm-flex justify-content-center">
    <div class="card" *ngFor="let item of projects" [attr.data-key]="item.name">
      <h5 class="card-title mt-5">{{ item.name }}</h5>
      <img [src]="item.image" class="mx-auto d-block" style="width: 15rem;"/>
      <div class="card-body text-black">
        <p class="card-text">{{ item.description }}</p>
        <a [href]="item.GitHub" target="_blank" class="github-link">
          <button type="button" class="btn btn-secondary btn-md github-btn">Github</button>
        </a>
        <a [href]="item.Live" target="_blank" class="live-link">
          <button type="button" class="btn btn-secondary btn-md live-btn">Live</button>
        </a>
      </div>
    </div>
  </div>
</div>
